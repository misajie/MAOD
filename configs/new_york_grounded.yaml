seed: 1234
task: >-
  Predict the public Deep Gravity New York STATE GeoDS general movement example,
  not a commuting-only dataset. Retain the original census tracts, tile destination
  supports and original heldout tiles. Develop using training and validation tiles
  only; do not read heldout metrics. Origin row totals are given, so explain
  destination allocation, diagonal share and off-diagonal movement separately.
  Survey raw historical OSM for distinctions lost by the supplied aggregates,
  inspect local objects and feature-similar regions, and compile reusable
  destination or OD relation measurements. The original geographic aggregates
  have uncertain area/length units. Five poly__1 columns are constant zero;
  poly__0 columns correspond to upstream polygon counts. Preserve the original
  DG backbone inputs for the comparison, but do not build mechanisms on zero columns.
  All DG parameters remain trainable. Spatial-program contributions form an
  additive learned logit correction, followed by full-row softmax normalization.
env_file: .env.example
rag_root: resources/LLMrag
output_dir: runs/new_york_grounded
data:
  format: generic
  prepared: data/processed/new_york
  osm_path: data/processed/new_york/osm_2020_objects.parquet
  latest_osm_year: 2021
training:
  device: cuda
  hidden_sizes: [256, 256, 256, 256, 256, 128, 128, 128, 128, 128, 128, 128, 128, 128, 128]
  dropout: 0.0
  epochs: 100
  batch_size: 32
  sample_destinations: 512
  learning_rate: 0.000005
  program_learning_rate: 0.0003
  program_l1: 0.0001
  momentum: 0.9
  loss: count_weighted
  gradient_clip: 5.0
  cpu_threads: 8
  select_validation_checkpoint: true
  selection_metric: offdiagonal_cpc
  validation_every: 5
  patience_epochs: 30
  min_epochs: 30
search:
  rounds: 3
  candidates_per_round: 2
  candidate_epochs: 50
  min_improvement: 0.0001
llm:
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  model_env: DEEPSEEK_MODEL
  temperature: 0.2
  max_tokens: 12000
  timeout_seconds: 240
  extra_body:
    thinking:
      type: disabled
  embeddings:
    enabled: true
    api_key_env: QWEN_API_KEY
    base_url_env: QWEN_BASE_URL
    model_env: QWEN_EMBEDDING_MODEL
    batch_size: 10
  rag_cache_dir: runs/new_york_main/agents/rag_cache
